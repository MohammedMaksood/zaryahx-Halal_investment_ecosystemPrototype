<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="islamic-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Geometric Islamic pattern with 8-pointed stars -->
      <g fill="none" stroke="#9b87f5" stroke-width="0.5" opacity="0.3">
        <!-- Center star -->
        <path d="M50,20 L60,50 L90,60 L60,70 L50,100 L40,70 L10,60 L40,50 Z" />
        
        <!-- Connecting lines -->
        <path d="M0,0 L20,20" />
        <path d="M0,100 L20,80" />
        <path d="M100,0 L80,20" />
        <path d="M100,100 L80,80" />
        
        <!-- Corner decorative elements -->
        <circle cx="0" cy="0" r="5" />
        <circle cx="100" cy="0" r="5" />
        <circle cx="0" cy="100" r="5" />
        <circle cx="100" cy="100" r="5" />
        
        <!-- Connecting arcs -->
        <path d="M10,50 A40,40 0 0,1 50,10" />
        <path d="M50,10 A40,40 0 0,1 90,50" />
        <path d="M90,50 A40,40 0 0,1 50,90" />
        <path d="M50,90 A40,40 0 0,1 10,50" />
        
        <!-- Decorative inner elements -->
        <circle cx="50" cy="50" r="15" />
        <circle cx="50" cy="50" r="5" />
        
        <!-- Radiating lines -->
        <line x1="50" y1="0" x2="50" y2="20" />
        <line x1="50" y1="80" x2="50" y2="100" />
        <line x1="0" y1="50" x2="20" y2="50" />
        <line x1="80" y1="50" x2="100" y2="50" />
      </g>
    </pattern>
  </defs>
  
  <rect width="300" height="300" fill="url(#islamic-pattern)" />
</svg>
